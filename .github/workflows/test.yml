name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test projects/level-3-task-progress/task-progress.test.js projects/level-5-task-report/report.test.js projects/graduation-dashboard/dashboard.test.js

      - name: Run report CLI smoke test
        run: node projects/level-5-task-report/report-cli.js projects/level-5-task-report/example-tasks.json
